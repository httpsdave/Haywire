name: Scrape & Update Data

on:
  schedule:
    # Every 2 hours from 6 AM to midnight PHT (UTC+8)
    # PHT 6AM = UTC 22:00 (prev day), PHT midnight = UTC 16:00
    - cron: '0 22,0,2,4,6,8,10,12,14,16 * * *'
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: 'Skip scraping (use existing data)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

concurrency:
  group: 'scrape'
  cancel-in-progress: true

jobs:
  scrape-and-commit:
    name: Scrape News & Commit Data
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_scrape != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scrapers/requirements.txt'

      - name: Install Python dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Run scrapers
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: "Haywire News Aggregator v1.0 (by /u/haywire_bot)"
        working-directory: scrapers
        run: python main.py --verbose

      - name: Export data to site
        run: python3 scripts/export_site_data.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/src/data/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore(data): update news data [$(date -u +%Y-%m-%d %H:%M UTC)]"
            git push
            echo "Data committed and pushed — Vercel will auto-deploy"
          fi
