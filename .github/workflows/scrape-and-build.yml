    if not fname.endswith('.json') or fname == 'metadata.json':
        continue
    cat_key = fname.replace('.json', '')
    with open(os.path.join(DATA_DIR, fname), 'r') as f:
        raw = json.load(f)
    slug = raw.get('slug', SLUG_MAP.get(cat_key, cat_key))
    articles = raw.get('articles', [])
    clean = []
    for a in articles:
        c = dict(a)
        if 'source_type' in c: c['sourceType'] = c.pop('source_type')
        if 'comment_count' in c: c['commentCount'] = c.pop('comment_count')
        if 'is_featured' in c: c['isFeatured'] = c.pop('is_featured')
        c.pop('_rank', None)
        clean.append(c)
    cat_data = {'name': raw.get('display_name', cat_key), 'slug': slug, 'articles': clean}
    categories.append(cat_data)
    with open(os.path.join(SITE_DIR, slug + '.json'), 'w') as f:
        json.dump(cat_data, f, indent=2, ensure_ascii=False)

combined = {'date': '$TODAY', 'updated_at': datetime.now(timezone.utc).isoformat(), 'categories': categories}
with open(os.path.join(SITE_DIR, 'all_news.json'), 'w') as f:
    json.dump(combined, f, indent=2, ensure_ascii=False)
print(f'Copied {len(categories)} categories to {SITE_DIR}')
"
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'site/package-lock.json'

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build Astro site
        working-directory: site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
