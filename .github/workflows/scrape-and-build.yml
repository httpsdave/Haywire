name: Scrape & Build Haywire

on:
  schedule:
    # Every 2 hours from 6 AM to midnight PHT (UTC+8)
    # PHT 6AM = UTC 22:00 (prev day), PHT midnight = UTC 16:00
    - cron: '0 22,0,2,4,6,8,10,12,14,16 * * *'
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: 'Skip scraping (use existing data)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  scrape:
    name: Scrape News Sources
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_scrape != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scrapers/requirements.txt'

      - name: Install Python dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Run scrapers
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: "Haywire News Aggregator v1.0 (by /u/haywire_bot)"
        working-directory: scrapers
        run: python main.py --verbose

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: news-data
          path: data/
          retention-days: 7

  build:
    name: Build & Deploy Site
    runs-on: ubuntu-latest
    needs: scrape
    if: always() && (needs.scrape.result == 'success' || needs.scrape.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download scraped data
        if: needs.scrape.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: news-data
          path: data/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'site/package-lock.json'

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build Astro site
        working-directory: site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
