name: Manual Build Check

on:
  workflow_dispatch:
    inputs:
      use_mock_data:
        description: 'Build with existing committed data (dry run)'
        required: false
        default: 'true'
        type: boolean

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'site/package-lock.json'

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Report
        run: |
          echo "Build successful!"
          echo "Output size: $(du -sh site/dist | cut -f1)"
          echo "Files: $(find site/dist -type f | wc -l)"
